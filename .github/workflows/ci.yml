name: CI

# Builds and tests every pull request and push to main. BundledTranslationsTest fails when data/
# was edited without running ./gradlew bundleTranslations, so a stale bundle never gets merged.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Build and test
        run: ./gradlew build
