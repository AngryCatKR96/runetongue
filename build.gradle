plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.runetongue.RuneTonguePluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.runetongue'

// Developer tools, not part of the plugin jar. The Plugin Hub builds "standard" plugins with its
// own build.gradle, so their output is committed: run bundleTranslations after editing data/.
sourceSets {
	bundler {
		compileClasspath += sourceSets.main.output.classesDirs
		runtimeClasspath += sourceSets.main.output.classesDirs
	}
}

tasks.register('bundleTranslations', JavaExec) {
	description = 'Writes data/<lang>/*.tsv into src/main/resources/com/runetongue/translations_<lang>.tsv.gz.'
	classpath = sourceSets.bundler.runtimeClasspath
	mainClass = 'com.runetongue.bundler.BundleTranslations'
	def reportDir = layout.buildDirectory.dir('reports/translations')
	args file('data').path, file('src/main/resources').path, reportDir.get().asFile.path
}

tasks.register('makeIcon', JavaExec) {
	description = 'Draws the Plugin Hub icon.png from the bundled glyph font.'
	classpath = sourceSets.bundler.runtimeClasspath + files(sourceSets.main.output.resourcesDir)
	mainClass = 'com.runetongue.bundler.MakeIcon'
	dependsOn 'processResources'
	args file('icon.png').path
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	if (System.getProperty('os.name').toLowerCase().contains('mac')) {
		jvmArgs "--add-exports", "java.desktop/com.apple.eawt=ALL-UNNAMED",
			"--add-opens", "java.desktop/com.apple.eawt=ALL-UNNAMED"
	}
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
